<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Tennis Pronostics</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Écran de connexion admin (affiché tant que non connecté) -->
<div id="admin-gate" class="admin-gate" hidden>
  <div class="admin-gate-card" id="admin-gate-card"></div>
</div>

<div class="admin-layout" id="admin-layout" hidden>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="../" class="back-link">← Retour au jeu</a>
      <h1>⚙️ Admin</h1>
    </div>

    <nav class="sidebar-nav">
      <button onclick="showTab('tournois')" id="tab-tournois">🏆 Tournois</button>
      <button onclick="showTab('compte')"  id="tab-compte">🔐 Compte admin</button>
    </nav>

    <div class="sidebar-foot">
      <span class="sidebar-user" id="adminUserLabel">—</span>
      <button class="btn-red" onclick="adminLogout()">Déconnexion</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="admin-main">
    <div id="content">
      <p style="color:#888; text-align:center; padding:60px;">Chargement...</p>
    </div>
  </main>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
