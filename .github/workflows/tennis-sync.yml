name: Sync tennis draws & results

on:
  schedule:
    # Le workflow tourne souvent mais sync.js espace lui-même les appels :
    # RapidAPI toutes les 75 min x nb de tournois API (quota 50/jour),
    # Wikipedia toutes les heures.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}      # bouton "Run workflow" manuel : force la synchro

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Write service account key
        working-directory: scripts
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
          chmod 600 serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Sync tracked tournaments
        working-directory: scripts
        run: node sync.js
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
