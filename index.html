<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎾 Tennis Pronostics</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Barre de titre -->
<header>
  <h1>🎾 Tennis Pronostics</h1>
  <div class="header-right">
    <div id="auth-zone" class="auth-zone"></div>
  </div>
</header>

<!-- Modale d'authentification (peuplée dynamiquement) -->
<div id="auth-modal" class="auth-modal" hidden>
  <div class="auth-modal-backdrop" onclick="closeAuthModal()"></div>
  <div class="auth-modal-card" id="auth-modal-card"></div>
</div>

<!-- Barre de navigation principale -->
<nav class="mainnav" id="mainnav" hidden>
  <button id="nav-home"    class="navbtn active" onclick="goHome()">🏆 Tournois</button>
  <button id="nav-general" class="navbtn"        onclick="goGeneral()">🌍 Classement général</button>
  <button id="nav-pronos"  class="navbtn"        onclick="goMesPronos()">🎯 Mes Pronostics</button>
</nav>

<div class="container">
  <div id="content"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
